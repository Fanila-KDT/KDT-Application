<div class="sidebar">
  <div class="logo-container">
    <img [src]="urlConfig.Local.Logo_Url" alt="Logo" class="logo" />
  </div>

  <ul class="nav-list" *ngIf="activeHeader !== 'dashboard'">
    <!-- Masters -->
    <ng-container *ngIf="sidebarConfig[activeHeader]?.masters?.length">
      <li class="main-button"
          [class.active]="openSection === 'masters'"
          (click)="toggleSection('masters')">
        Masters
      </li>
      <div class="sub-list" *ngIf="openSection === 'masters'">
        <a *ngFor="let item of sidebarConfig[activeHeader]?.masters"
           [routerLink]="item.path"
           routerLinkActive="active">
          {{ item.label }}
        </a>
      </div>
    </ng-container>

    <!-- Transactions -->
    <ng-container *ngIf="sidebarConfig[activeHeader]?.transactions?.length">
      <li class="main-button"
          [class.active]="openSection === 'transactions'"
          (click)="toggleSection('transactions')">
        Transactions
      </li>
      <div class="sub-list" *ngIf="openSection === 'transactions'">
        <a *ngFor="let item of sidebarConfig[activeHeader]?.transactions"
           [routerLink]="item.path"
           routerLinkActive="active">
          {{ item.label }}
        </a>
      </div>
    </ng-container>

    <!-- Reports -->
    <ng-container *ngIf="sidebarConfig[activeHeader]?.reports?.length">
      <li class="main-button"
          [class.active]="openSection === 'reports'"
          (click)="toggleSection('reports')">
        Reports
      </li>
      <div class="sub-list" *ngIf="openSection === 'reports'">
        <a *ngFor="let item of sidebarConfig[activeHeader]?.reports"
           [routerLink]="item.path"
           routerLinkActive="active">
          {{ item.label }}
        </a>
      </div>
    </ng-container>
  </ul>
</div>

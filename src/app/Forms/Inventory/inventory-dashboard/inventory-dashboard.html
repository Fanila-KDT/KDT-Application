<div class="dashboard-content">

  <!-- Summary Cards -->
  <div class="dashboard-grid">
    <h2 style="margin-top: 45px;margin-left: 60px;">Pending Receipts</h2>
    <a class="summary-card" (click)="onLocalClick()">
      <h3>Local Pending Receipts</h3>
      <div class="value">{{localPOsCount}}</div>
      <div class="change">click here for more details</div>
    </a>
    <a class="summary-card" (click)="onForeignClick()">
      <h3>Foreign Pending Receipts</h3>
      <div class="value">{{foreignPOsCount}}</div>
      <div class="change">click here for more details</div>
    </a>
     <!-- <a href="/cash-report" class="summary-card">
      <h3></h3>
      <div class="value"></div>
      <div class="change"></div>
    </a> -->
    <a  class="summary-card">
      <h3><b>Total Receipts</b></h3>
      <div class="value">{{TotalCount}}</div>
      <div class="change"></div>
    </a> 
  </div>

  <!-- Chart Section -->
  <a href="/balance-report" class="chart-box">
    <h3></h3>
    <canvas id="balanceChart"></canvas>
  </a>

  <!-- Progress Indicators -->
  <div class="dashboard-grid">
    <a href="/income-budget" class="progress-indicator">
      <canvas id="incomeProgress"></canvas>
      <div class="label"></div>
      <div class="balance"></div>
      <span></span>
    </a>
    <a href="/expense-budget" class="progress-indicator">
      <canvas id="expenseProgress"></canvas>
      <div class="label"></div>
      <div class="balance"></div>
      <span></span>
    </a>
  </div>

</div>

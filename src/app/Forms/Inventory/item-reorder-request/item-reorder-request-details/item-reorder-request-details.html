 <div class="container-fluid">
  <form ngForm #itemReorderRequestModelForm="ngForm" name="form" (ngSubmit)="itemReorderRequestModelForm.form.valid && onSubmit(itemReorderRequestModelForm)" novalidate>
    <div class="row">
       <!-- <div class="input-wrapper">
          <input type="text" class="label-input" id="voucher_id" disabled name="voucher_id"  name="voucher_id" 
          [(ngModel)]="itemReorderRequestModel.voucher_id" #voucher_id="ngModel">
      </div>   -->
      <!--Doc No -->
        <div class="col-md-2">
            <div class="label-wrapper d-flex align-items-center">
            <label for="document_number" class="form-label  mb-0">Doc No
            </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="document_number" disabled name="document_number"  name="document_number" 
                [(ngModel)]="itemReorderRequestModel.document_number" #document_number="ngModel">
            </div>
        </div>
      <!-- Entry Date -->
        <div class="col-md-2">
          <div class="label-wrapper">
            <label for="voucher_date" class="form-label">Entry Date
            </label>
          </div>
          <div class="input-wrapper">
            <div class="datepicker-wrapper">
              <input type="text" class="form-control" bsDatepicker #dp="bsDatepicker" placeholder="dd/MM/yyyy" [disabled]="isEditable"
                [bsConfig]="{
                  dateInputFormat: 'DD/MM/YYYY',
                  showWeekNumbers: false
                }"
                (bsValueChange)="onDateSelected($event)" [ngModel]="itemReorderRequestModel.voucherDate" (ngModelChange)="formatToDateInput($event)" [ngModelOptions]="{ standalone: true }"
                />
              <button type="button" class="btn btn-outline-secondary" (click)="dp.show()" [disabled]="isEditable">
                📅
              </button>
            </div> 
          </div>
        </div>
      <!-- Order Date -->
        <div class="col-md-2">
          <div class="label-wrapper">
            <label for="order_date" class="form-label">Order Date
                <span class="required-star">*</span>
            </label>
          </div>
          <div class="input-wrapper">
            <div class="datepicker-wrapper">
              <input type="text" class="form-control" bsDatepicker #dp1="bsDatepicker" placeholder="dd/MM/yyyy" [disabled]="isEditable"
                [bsConfig]="{
                  dateInputFormat: 'DD/MM/YYYY',
                  showWeekNumbers: false
                }"
                (bsValueChange)="onDateSelected1($event)" [ngModel]="itemReorderRequestModel.orderDate" (ngModelChange)="formatToDateInput1($event)" [ngModelOptions]="{ standalone: true }"
                 [ngClass]="{'is-invalid': isOrderDateInvalid}"/>
              <button type="button" class="btn btn-outline-secondary" (click)="dp1.show()" [disabled]="isEditable">
                📅
              </button>
              </div> 
          </div>
        </div>
      <!-- Brand -->
        <div class="col-md-2">
            <div class="label-wrapper d-flex align-items-center">
                <label for="productClass" class="form-label  mb-0">Brand
                <span class="required-star">*</span>
                </label>
            </div>
            <select class="form-control label-input pt-0 pb-1" id="brand_id" (change)="onSelectChange()" [ngClass]="{'is-invalid': isBrandInvalid}"
                name="brand_id" [(ngModel)]="itemReorderRequestModel.brand_id" #itemCode="ngModel" [disabled]="isEditable" >
                <option *ngFor="let brand of brandList" [value]="brand.brand_id">{{ brand.brand_name }}</option>
            </select>
        </div>
      <!-- Product Category -->
        <div class="col-md-2">
          <div class="label-wrapper d-flex align-items-center">
              <label for="item_type" class="form-label mb-0">Product Category
                <span class="required-star">*</span>
              </label>
          </div>
          <div class="input-wrapper">
            <select [(ngModel)]="itemReorderRequestModel.item_type"  class="form-control label-input" [disabled]="isEditable" 
              dropdownPanelClass="'black-dropdown'"  [ngClass]="{'is-invalid': isPCategoryInvalid}"
              [ngModelOptions]="{ standalone: true }" style="height: 28px;line-height:20px; padding-top:2px;" (change)="onSelectChange()">
                <option value="Consumable">Consumable</option>
                <option value="Service Consumables">Service Consumables</option>
                <option value="Spare Parts">Spare Parts</option>
            </select>
          </div>
        </div>
      <!-- Product Type -->
        <div class="col-md-2">
        <div class="label-wrapper d-flex align-items-center">
            <label for="product_type" class="form-label">Product Type
                <span class="required-star">*</span>
            </label>
        </div>
        <select class="form-control label-input pt-0 pb-1" id="product_type" (change)="onSelectChange()"  [ngClass]="{'is-invalid': isPTypeInvalid}"
        name="product_type" [(ngModel)]="itemReorderRequestModel.product_type" #itemCode="ngModel" [disabled]="isEditable" >
            <option *ngFor="let productType of productTypeList" [value]="productType">{{ productType }}</option>
        </select>
        </div>
       <!--PO No -->
        <div class="col-md-2">
            <div class="label-wrapper d-flex align-items-center">
            <label for="po_no" class="form-label  mb-0">Po No
            </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="po_no" disabled name="po_no"  name="po_no" 
                [(ngModel)]="itemReorderRequestModel.po_no" #po_no="ngModel">
            </div>
        </div>
      <!--Reference-->
        <div class="col-md-3">
          <div class="label-wrapper">
            <label for="voucher_reference" class="form-label">Reference
            </label>
          </div>
          <div class="input-wrapper">
              <textarea class="label-input" id="voucher_reference" name="voucher_reference" rows="2"
                [(ngModel)]="itemReorderRequestModel.voucher_reference" #voucher_reference="ngModel" [disabled]="isEditable" >
              </textarea>
          </div>
        </div>
    </div>

    <ngx-datatable 
      class="table table-bordered styled-grid"
      [rows]="rows"
      [scrollbarV]="scroll"
      [virtualization]="true"
      [style.height.px]="gridHeight"
      [columnMode]="'force'"
      [headerHeight]="50"
      [footerHeight]="60"
      [rowHeight]="30"
      [limit]="controls.pageSize"
      [externalPaging]="false"
      [selected]="selected"
      [messages]="{ emptyMessage: 'No data to display' }"
      [reorderable]="reorderable"
      [selectionType]="SelectionType.single"
      [rowIdentity]="getRowIdentity"
      (activate)="onSubListActivate($event)">

      <!-- Sl No -->
      <ngx-datatable-column name="Sl No"  prop="seq_no" [maxWidth]="80">
        <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
          <input 
          type="text" 
            class="form-control" 
            value ="{{ rowIndex + 1 }}" disabled
            />
        </ng-template>
      </ngx-datatable-column>

      <!-- Item Code -->
      <ngx-datatable-column name="Item Code" prop="item_code">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.item_code"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Model Name -->
      <ngx-datatable-column name="Model Name" prop="item_name_abbr">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.item_name_abbr"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Fgn Rate-->
      <ngx-datatable-column name="Fgn Rate" prop="fgn_unit_price">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.fgn_unit_price"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Iss Qty(12M)-->
      <ngx-datatable-column name="Iss Qty(12M)" prop="iss_qty">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.iss_qty"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Iss Per Day-->
      <ngx-datatable-column name="Iss Per Day" prop="per_day">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.per_day"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- End Stock-->
      <ngx-datatable-column name="End Stock" prop="end_stock">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.end_stock"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Back Order-->
      <ngx-datatable-column name="Back Order" prop="backorder_qty">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.backorder_qty"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Base Stock (90 Days)-->
      <ngx-datatable-column name="Base Stock(90 Days)" prop="base_stock">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.base_stock"   
            disabled />
        </ng-template>
      </ngx-datatable-column>
      
      <!-- Base Stock Value-->
      <ngx-datatable-column name="Base Stock Value" prop="base_stock_value">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.base_stock_value"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Suggested Quantity-->
      <ngx-datatable-column name="Suggested Qty" prop="suggested_qty">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.suggested_qty"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Approved Quantity-->
      <ngx-datatable-column name="Approved Qty" prop="approved_qty">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="number" 
            class="form-control grid-input" 
            [(ngModel)]="row.approved_qty" 
            [disabled]="isEditable"  (change)="ApprovedQtyChange(row.approved_qty,row)" (change)="ApproveAssign(row)" 
            [ngModelOptions]="{ standalone: true }" />
        </ng-template>
      </ngx-datatable-column>

      <!-- Approved Value-->
      <ngx-datatable-column name="Approved Value(EUR)" prop="approved_value">
        <ng-template let-row="row" ngx-datatable-cell-template >
          <input 
            type="text" 
            class="form-control grid-input" 
            [value]="row.approved_value"   
            disabled />
        </ng-template>
      </ngx-datatable-column>

      <!-- Footer -->
      <ngx-datatable-footer>
        <ng-template ngx-datatable-footer-template>
          <div class="col-md-12 d-flex justify-content-end align-items-center gap-2 datatable-footer-border">
            <span>Total Rows: {{ rows.length }}</span>
            <div class="btn-group">
              <button type="button" class="btn btn-primary" style="background-color: rgb(80, 121, 209);" (click)="loadRows()" [disabled]="isEditable"><i class="fas fa-sync-alt"></i>  <b>Load Items</b></button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-footer>
    </ngx-datatable>

    <div class="row">
      <!--Status-->
      <div class="col-md-2">
          <div class="label-wrapper d-flex align-items-center">
          <label for="status" class="form-label  mb-0">Status
          </label>
          </div>
          <div class="input-wrapper">
              <input type="text" class="label-input" id="status" [disabled]="statusDisable" name="status"  name="status" 
              [(ngModel)]="itemReorderRequestModel.status" #status="ngModel">
          </div>
      </div>
      <!-- Total Qty -->
      <div class="col-md-2 ms-auto">
        <div class="label-wrapper">
            <label for="totalQty" class="form-label">Total Qty</label>
        </div>
        <div class="input-wrapper">
            <input type="text" class="label-input" id="totalQty" [disabled]="true" name="totalQty" [(ngModel)]="totalQty" #totalQtys="ngModel">
        </div>
      </div>
      <!-- Total Qty -->
      <div class="col-md-2">
        <div class="label-wrapper">
            <label for="totalAmount" class="form-label">Total Value</label>
        </div>
        <div class="input-wrapper">
            <input type="text" class="label-input" id="totalAmount" [disabled]="true" name="totalAmount" [(ngModel)]="totalValue" #totalAmounts="ngModel">
        </div>
      </div>
    </div>

    <div class="row">
      <!-- Created By-->
      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="created_by" class="form-label">Created By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="created_by" [disabled]="true"  
              name="created_by" [(ngModel)]="itemReorderRequestModel.created_by" #created_by="ngModel">
        </div>
      </div>
      <!-- Created On-->
      <div class="col-md-1">
        <div class="label-wrapper">
          <label for="created_date" class="form-label">Created On
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="created_date" [disabled]="true"  
              name="created_date" [(ngModel)]="itemReorderRequestModel.created_date" #created_date="ngModel">
        </div>
      </div>
      <!-- Updated By -->
      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="modified_by" class="form-label">Modified By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="modified_by" [disabled]="true"  
              name="modified_by" [(ngModel)]="itemReorderRequestModel.modified_by" #modified_by="ngModel">
        </div>
      </div>
      <!-- Updated On -->
      <div class="col-md-1">
        <div class="label-wrapper">
          <label for="modified_date" class="form-label">Modified On
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="modified_date" [disabled]="true"  
              name="modified_date" [(ngModel)]="itemReorderRequestModel.modified_date" #modified_date="ngModel">
        </div>
      </div>

      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="approved_by" class="form-label">Approved By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="approved_by" [disabled]="true"  
              name="approved_by" [(ngModel)]="itemReorderRequestModel.approved_by" #approved_by="ngModel">
        </div>
      </div>
      <!-- Remarks -->
      <div class="col-md-4">
        <div class="label-wrapper">
          <label for="approver_remarks" class="form-label">Approval Remarks
          </label>
        </div>
        <div class="input-wrapper">
            <textarea class="label-input" id="approver_remarks" name="approver_remarks" rows="2"
              [(ngModel)]="itemReorderRequestModel.approver_remarks" #approver_remarks="ngModel" [disabled]="true" >
            </textarea>
        </div>
      </div>
    </div>

    <!-- Footer Buttons -->
    <div class="inbox-compose-footer" style="overflow: hidden;">
      <div class="btn-group pull-right">
        <div class="badge bg-color-greenLight action mine"></div>
        <button type="submit" class="btn btn-primary" style="margin-right: 5px" [disabled]="saveDisable">
          <i class="fa fa-save"></i>Save
        </button>
        <button type="button" class="btn btn-danger" [disabled]="cancelDisable" (click)="cancelClickMethod()">
          <i class="fa fa-ban"></i>Cancel
        </button>
      </div>
    </div> 
  </form>
</div>

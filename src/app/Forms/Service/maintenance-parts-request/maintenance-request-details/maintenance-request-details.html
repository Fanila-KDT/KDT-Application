<div class="container-fluid">
  <form ngForm #Form="ngForm" name="form" (ngSubmit)="Form.form.valid && onSubmit(Form)" novalidate>
      <div class="row">
        <!-- Doc No -->
        <div class="col-md-2">
          <div class="label-wrapper">
            <label for="document_number" class="form-label">Doc No</label>
          </div>
          <input type="text" class="label-input" id="document_number" [disabled]="true"
            name="document_number" [(ngModel)]="maintenanceRequestModel.document_number" #document_number="ngModel">
        </div>
        <!-- Entry Date -->
        <div class="col-md-2">
            <div class="label-wrapper">
            <label for="voucher_date" class="form-label">
                Entry Date
            </label>
            </div>
            <div class="input-wrapper">
            <div class="datepicker-wrapper">
                <input type="text" class="form-control" bsDatepicker #dp="bsDatepicker" placeholder="dd/MM/yyyy" [disabled]="itemDisable"
                [bsConfig]="{
                    dateInputFormat: 'DD/MM/YYYY',
                    showWeekNumbers: false
                }"
                (bsValueChange)="onDateSelected($event)" [ngModel]="maintenanceRequestModel.voucherDate" (ngModelChange)="formatToDateInput($event)" [ngModelOptions]="{ standalone: true }"
                />
                <button type="button" class="btn btn-outline-secondary" (click)="dp.show()" [disabled]="itemDisable">
                📅
                </button>
                </div> 
            </div>
        </div>
        <!-- Tag No -->
        <div class="col-md-2">
          <div class="label-wrapper d-flex align-items-center">
              <label for="market_channel_name" class="form-label mb-0">Tag No
                <span class="required-star">*</span>
              </label>
          </div>
          <div class="input-wrapper">
              <ng-select  [items]="TagList" bindLabel="tag_no" bindValue="tag_id" [(ngModel)]="maintenanceRequestModel.tag_id" class="select-input"
                [disabled]="itemDisable" dropdownPanelClass="'black-dropdown'" [ngModelOptions]="{ standalone: true }" [ngClass]="{'is-invalid': isTagNoInvalid}" > 
              </ng-select>
          </div>
        </div>
        <!-- Model Name -->
        <div class="col-md-2">
          <div class="label-wrapper d-flex align-items-center">
              <label for="market_channel_name" class="form-label mb-0">Model Name
              </label>
          </div>
          <div class="input-wrapper">
              <ng-select  [items]="TagList" bindLabel="model_name" bindValue="tag_id" [(ngModel)]="maintenanceRequestModel.tag_id" class="select-input"
                [disabled]="itemDisable" dropdownPanelClass="'black-dropdown'" [ngModelOptions]="{ standalone: true }"  > 
              </ng-select>
          </div>
        </div>
        <!-- Narration -->
        <div class="col-md-3">
          <div class="label-wrapper">
            <label for="narration" class="form-label">Narration
            </label>
          </div>
          <div class="input-wrapper">
            <input type="text" class="label-input" id="narration" [disabled]="itemDisable" 
              name="narration" [(ngModel)]="maintenanceRequestModel.narration" #narration="ngModel">
            </div>
        </div>
      </div>
      <br>
        <ngx-datatable
        class="table table-bordered styled-grid"
        [rows]="rows"
        [scrollbarV]="scroll"
        [virtualization]="true"
        [style.height.px]="gridHeight"
        [columnMode]="'force'"
        [headerHeight]="80"
        [footerHeight]="60"
        [rowHeight]="30"
        [limit]="controls.pageSize"
        [externalPaging]="false"
        [selected]="selected"
        [messages]="{ emptyMessage: 'No data to display' }"
        [reorderable]="reorderable"
        [selectionType]="SelectionType.single"
        [rowIdentity]="getRowIdentity"
        (activate)="onSubListActivate($event)">
    
        <!-- Sl No -->
            <ngx-datatable-column name="Sl No"  prop="seqno" [maxWidth]="80">
                <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
                <input 
                type="text" 
                    class="form-control" 
                    value ="{{ rowIndex + 1 }}" disabled 
                    />
                </ng-template>
            </ngx-datatable-column>
    
        <!-- Item Code -->
        <ngx-datatable-column name="Item Code" prop="item_no" >
            <ng-template let-row="row" ngx-datatable-cell-template>
            <ng-select
                [items]="ItemList"
                bindLabel="item_code"
                bindValue="item_no"
                [(ngModel)]="row.item_no"
                (change)="ItemCodeEnter(row.item_no, row)"
                [disabled]="itemDisable"
                class="form-control grid-select"
                [ngModelOptions]="{ standalone: true }"
                [appendTo]="'body'">
            </ng-select>
            </ng-template>
        </ngx-datatable-column>
    
        <!-- Model Name -->
        <ngx-datatable-column name="Model Name" prop="item_name_abbr" >
            <ng-template let-row="row" ngx-datatable-cell-template>
                <input
                list="ItemList"
                type="text"
                class="form-control"
                [(ngModel)]="row.item_name_abbr"
                [ngModelOptions]="{standalone: true}"
                (change)="ModelNameChange(row)"
                [disabled]="itemDisable" />
    
                <datalist id="ItemList">
                <option *ngFor="let item of ItemList" [value]="item.item_code + ' - ' + item.item_name_abbr">
                </option>
                </datalist>
            </ng-template>
        </ngx-datatable-column>
    
        <!-- Qty -->
        <ngx-datatable-column name="Qty" prop="quantity" >
            <ng-template let-row="row" ngx-datatable-cell-template>
            <input
                type="number"
                class="form-control grid-input"
                [(ngModel)]="row.quantity"
                [disabled]="itemDisable" 
                [ngModelOptions]="{ standalone: true }" />
            </ng-template>
        </ngx-datatable-column>
    
        <!-- Delete -->
        <ngx-datatable-column name="Delete" [maxWidth]="70">
            <ng-template let-rowIndex="rowIndex" ngx-datatable-cell-template>
            <button
                type="button"
                class="btn btn-danger btn-sm delete-btn"
                (click)="deleteRow(rowIndex)"
                [disabled]="itemDisable">
                🗑️
            </button>
            </ng-template>
        </ngx-datatable-column>
    
        <!-- Footer -->
        <ngx-datatable-footer>
            <ng-template ngx-datatable-footer-template>
            <div class="col-md-12 d-flex justify-content-end align-items-center gap-2 datatable-footer-border">
                <span>Total Rows: {{ rows.length }}</span>
                <div class="btn-group">
                <button type="button" class="btn btn-add" (click)="addRow()" [disabled]="itemDisable">➕ Add</button>
                </div>
            </div>
            </ng-template>
        </ngx-datatable-footer>
        </ngx-datatable>
 
      <br>
    <div class="row">
      <!--Status-->
      <div class="col-md-2">
          <div class="label-wrapper d-flex align-items-center">
          <label for="approval_status" class="form-label  mb-0">Status
          </label>
          </div>
          <div class="input-wrapper">
              <input type="text" class="label-input" id="approval_status" [disabled]="statusDisable" name="approval_status"  name="approval_status" 
              [(ngModel)]="maintenanceRequestModel.approval_status" #approval_status="ngModel">
          </div>
      </div>
    </div>
    <br>
    <div class="row">
      <!-- Created By-->
      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="created_by" class="form-label">Created By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="created_by" [disabled]="true"  
              name="created_by" [(ngModel)]="maintenanceRequestModel.created_by" #created_by="ngModel">
        </div>
      </div>
      <!-- Created On-->
      <div class="col-md-1">
        <div class="label-wrapper">
          <label for="created_date" class="form-label">Created On
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="created_date" [disabled]="true"  
              name="created_date" [(ngModel)]="maintenanceRequestModel.created_date" #created_date="ngModel">
        </div>
      </div>
      <!-- Updated By -->
      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="modified_by" class="form-label">Modified By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="modified_by" [disabled]="true"  
              name="modified_by" [(ngModel)]="maintenanceRequestModel.modified_by" #modified_by="ngModel">
        </div>
      </div>
      <!-- Updated On -->
      <div class="col-md-1">
        <div class="label-wrapper">
          <label for="modified_date" class="form-label">Modified On
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="modified_date" [disabled]="true"  
              name="modified_date" [(ngModel)]="maintenanceRequestModel.modified_date" #modified_date="ngModel">
        </div>
      </div>

      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="approved_by" class="form-label">Approved By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="approved_by" [disabled]="true"  
              name="approved_by" [(ngModel)]="maintenanceRequestModel.approved_by" #approved_by="ngModel">
        </div>
      </div>
      <!-- Remarks -->
      <div class="col-md-4">
        <div class="label-wrapper">
          <label for="approver_remarks" class="form-label">Approval Remarks
          </label>
        </div>
        <div class="input-wrapper">
            <textarea class="label-input" id="approver_remarks" name="approver_remarks" rows="2"
              [(ngModel)]="maintenanceRequestModel.approver_remarks" #approver_remarks="ngModel" [disabled]="true" >
            </textarea>
        </div>
      </div>
    </div>
    <br>
    <!-- Footer Buttons -->
    <div class="inbox-compose-footer" style="overflow: hidden;">
      <div class="btn-group pull-right">
        <div class="badge bg-color-greenLight action mine"></div>
        <button type="submit" class="btn btn-primary" style="margin-right: 5px" [disabled]="saveDisable">
          <i class="fa fa-save"></i>Save
        </button>
        <button type="button" class="btn btn-danger" [disabled]="cancelDisable" (click)="cancelClickMethod()">
          <i class="fa fa-ban"></i>Cancel
        </button>
      </div>
    </div> 
    </form>
</div>

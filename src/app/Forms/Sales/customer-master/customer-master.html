<div class="bg-body-secondary text-center py-5 rounded-2"> 
  <h2 class="display-6 fw-bold">Customer Master</h2> 
  <div class="container-fluid" >
    <fieldset class="fieldset-custom">
      <div class="row g-3">
        <!-- Button Group -->
        <div class="col-md-12 col-12">
          <div class="btn-toolbar flex-wrap gap-1 justify-content-start" style="margin-top:2px">
            <button type="button" class="btn btn-primary" (click)="buttonClick('N')" [disabled]="newDisable" >
              <i class="fa fa-plus me-1"></i> New
            </button>
            <button type="button" class="btn btn-info" (click)="buttonClick('M')" [disabled]="modifyDisable" >
              <i class="fa fa-edit me-1"></i> Modify
            </button>
            <button type="button" class="btn btn-danger" (click)="buttonClick('D')" [disabled]="deleteDisable" >
              <i class="fa fa-trash me-1"></i> Delete
            </button>
            <button type="button" class="btn btn-secondary" [disabled]="searchDisable" (click)="Search()">
              <i class="fa fa-search me-1"></i> Search
            </button>   
            <button type="button" class="btn btn-secondary" (click)="Refresh()" [disabled]="refreshDisable">
              <i class="fa fa-refresh me-1"></i>
            </button>
            <button type="button" class="btn btn-lg d-flex ms-auto shadow-sm" [disabled]="searchDisable" (click)="toggleValue()"> 
              <i [ngClass]="gridDisabled ? 'fa fa-eye-slash me-1' : 'fa fa-eye me-1'"></i>
            </button>
          </div>
        </div>
      </div> 
    </fieldset>
  </div>
  <!-- List Section -->
    <customer-master-list></customer-master-list>
  <!-- List Section -->
    <fieldset class="border mb-4">
      <customer-master-details></customer-master-details>
    </fieldset>
</div>

<div *ngIf="showModalSearch" class="modal fade show d-block" tabindex="-1" role="dialog" aria-labelledby="myLargeModalLabel" aria-hidden="true" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg" style="max-width: 500px;">
    <div class="modal-content shadow-lg rounded">
      <div class="modal-header bg-light border-bottom">
        <h5 class="modal-title text-primary">🔍 Search Here...</h5>
        <button type="button" class="btn btn-light rounded-circle shadow-sm position-absolute top-0 end-0 m-3"
                (click)="modalCancel()" aria-label="Close" title="Close">
          <i class="fas fa-times text-danger"></i>
        </button>
      </div>
      <div class="modal-body px-4 py-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="cardno" class="form-label fw-semibold">Customer Id</label>
            <input type="text" class="form-control form-control-sm" id="cardno"
                  name="cardno" [(ngModel)]="customerMasterSearch.cardno" #cardno="ngModel"
                  placeholder="Enter Customer Id">
          </div>

          <div class="col-md-6">
            <label for="name" class="form-label fw-semibold">Name</label>
            <input type="text" class="form-control form-control-sm" id="name" name="name" [(ngModel)]="customerMasterSearch.name" #name="ngModel"
                  placeholder="Enter Name">
          </div>

          <div class="col-md-6">
            <label for="market_channel_name" class="form-label fw-semibold">Market Channel</label>
            <div class="input-wrapper">
              <ng-select  [items]="MarketList" bindLabel="description" bindValue="market_channel_name" [(ngModel)]="customerMasterSearch.market_channel_name" 
                class="select-input"  dropdownPanelClass="'black-dropdown'" [ngModelOptions]="{ standalone: true }"  > 
              </ng-select>
            </div>
          </div>

          <div class="col-md-6">
            <label for="collector_id" class="form-label fw-semibold">Collector</label>
            <div class="input-wrapper">
              <ng-select  [items]="CollectorList" bindLabel="collector_name" bindValue="collector_id" [(ngModel)]="customerMasterSearch.collector_id" 
                class="select-input"  dropdownPanelClass="'black-dropdown'" [ngModelOptions]="{ standalone: true }"  > 
              </ng-select>
            </div>
          </div>

          <div class="col-md-4"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="customerMasterSearch.major_customer" 
                    name="major_customer" #major_customer="ngModel" style="margin-top:12px"> 
                <span class="checkmark"></span>
                <span class="checkbox-label">Major Customer</span>
              </label>
            </div>
          </div>

          <div class="col-md-4"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="customerMasterSearch.blacklist" 
                    name="blacklist" #blacklist="ngModel" style="margin-top:12px"> 
                <span class="checkmark"></span>
                <span class="checkbox-label">Black List</span>
              </label>
            </div>
          </div>

      </div>
      <div class="modal-footer bg-light border-top">
        <button class="btn btn-danger" (click)="modalCancel()">Cancel</button>
        <button class="btn btn-primary" (click)="modalSearch()">Search</button>
      </div>
    </div>
  </div>
  </div>
</div>

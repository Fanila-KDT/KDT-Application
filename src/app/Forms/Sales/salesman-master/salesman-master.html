<div class="bg-body-secondary text-center py-5 rounded-2"> 
  <h2 class="display-6 fw-bold">Salesman Master</h2> 
  <div class="container-fluid" >
    <fieldset class="fieldset-custom">
      <div class="row g-3">
        <!-- Button Group -->
        <div class="col-md-12 col-12">
          <div class="btn-toolbar flex-wrap gap-1 justify-content-start" style="margin-top:2px">
            <button type="button" class="btn btn-primary" (click)="buttonClick('N')" [disabled]="newDisable" >
              <i class="fa fa-plus me-1"></i> New
            </button>
            <button type="button" class="btn btn-info" (click)="buttonClick('M')" [disabled]="modifyDisable" >
              <i class="fa fa-edit me-1"></i> Modify
            </button>
            <button type="button" class="btn btn-danger" (click)="buttonClick('D')" [disabled]="deleteDisable" >
              <i class="fa fa-trash me-1"></i> Delete
            </button>
            <button type="button" class="btn btn-secondary" [disabled]="searchDisable" (click)="Search()">
              <i class="fa fa-search me-1"></i> Search
            </button>   
            <button type="button" class="btn btn-secondary" (click)="Refresh()" [disabled]="refreshDisable">
              <i class="fa fa-refresh me-1"></i>
            </button>
            <button type="button" class="btn btn-lg d-flex ms-auto shadow-sm" [disabled]="searchDisable" (click)="toggleValue()"> 
              <i [ngClass]="gridDisabled ? 'fa fa-eye-slash me-1' : 'fa fa-eye me-1'"></i>
            </button>
          </div>
        </div>
      </div> 
    </fieldset>
  </div>
  <!-- List Section -->
    <salesman-master-list></salesman-master-list>
  <!-- List Section -->
    <fieldset class="border mb-4">
      <salesman-master-details></salesman-master-details>
    </fieldset>
</div>

<div *ngIf="showModalSearch" class="modal fade show d-block" tabindex="-1" role="dialog" aria-labelledby="myLargeModalLabel" aria-hidden="true" style="background-color: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg" style="max-width: 500px;">
    <div class="modal-content shadow-lg rounded">
      <div class="modal-header bg-light border-bottom">
        <h5 class="modal-title text-primary">🔍 Search Here...</h5>
        <button type="button" class="btn btn-light rounded-circle shadow-sm position-absolute top-0 end-0 m-3"
                (click)="modalCancel()" aria-label="Close" title="Close">
          <i class="fas fa-times text-danger"></i>
        </button>
      </div>
      <div class="modal-body px-4 py-3">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="cardno" class="form-label fw-semibold">Area Group</label>
            <ng-select [items]="AreaGropList" bindLabel="group_code" bindValue="group_id" [(ngModel)]="salesmanMasterSearch.group_id"
              dropdownPanelClass="'black-dropdown'" [ngModelOptions]="{ standalone: true }" name="group_id" class="select-input" placeholder="Select Area Group">
            </ng-select>
          </div>

          <div class="col-md-6">
            <label for="cardno" class="form-label fw-semibold">Area Code</label>
            <input type="text" class="form-control form-control-sm" id="cardno"
                  name="cardno" [(ngModel)]="salesmanMasterSearch.area_code" #cardno="ngModel"
                  placeholder="Enter Area Code">
          </div>

          <div class="col-md-3" style="margin-top:28px"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="salesmanMasterSearch.active" 
                    name="active" #active="ngModel"> 
                <span class="checkmark"></span>
                <span class="checkbox-label">Active</span>
              </label>
            </div>
          </div>

          <div class="col-md-3" style="margin-top:28px"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="salesmanMasterSearch.manager" 
                    name="manager" #manager="ngModel" > 
                <span class="checkmark"></span>
                <span class="checkbox-label">Manager</span>
              </label>
            </div>
          </div>

          <div class="col-md-3" style="margin-top:28px"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="salesmanMasterSearch.sales_dept" 
                    name="sales_dept" #sales_dept="ngModel" > 
                <span class="checkmark"></span>
                <span class="checkbox-label">Sale Dept.</span>
              </label>
            </div>
          </div>

          <div class="col-md-3" style="margin-top:28px"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="salesmanMasterSearch.callcenter_agent" 
                    name="callcenter_agent" #callcenter_agent="ngModel" > 
                <span class="checkmark"></span>
                <span class="checkbox-label">Call Center</span>
              </label>
            </div>
          </div>

          <div class="col-md-4" style="margin-top:28px"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="salesmanMasterSearch.service_dept" 
                    name="service_dept" #service_dept="ngModel" > 
                <span class="checkmark"></span>
                <span class="checkbox-label">Service Dept.</span>
              </label>
            </div>
          </div>

          <div class="col-md-5" style="margin-top:28px;margin-left: 25px;"> 
            <div class="form-group">
              <label class="checkbox-wrapper">
                <input type="checkbox" class="checkbox style-0" [(ngModel)]="salesmanMasterSearch.cash_invoice" 
                    name="cash_invoice" #cash_invoice="ngModel"> 
                <span class="checkmark"></span>
                <span class="checkbox-label">Only Cash Invoice</span>
              </label>
            </div>
          </div>
        </div>
        <br>
         <div class="modal-footer bg-light border-top">
          <button class="btn btn-danger" (click)="modalCancel()">Cancel</button>
          <button class="btn btn-primary" (click)="modalSearch()">Search</button>
        </div> 
      </div>
    </div>
  </div>
</div>

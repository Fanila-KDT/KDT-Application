<div class="container-fluid">
  <form ngForm #SalesQuotationForm="ngForm" name="form" (ngSubmit)="SalesQuotationForm.form.valid && onSubmit(SalesQuotationForm)" novalidate>
    <div class="row">
        <!--  Document Number-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="document_number" class="form-label"> Document Number
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="document_number" [disabled]="true"  
                    name="document_number" [(ngModel)]="deliveryNoteModel.document_number" #document_number="ngModel"  >
            </div>
        </div>  

        <!-- Entry Date -->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="voucherDate" class="form-label">Entry Date
                </label>
            </div>
            <div class="input-wrapper">
                <div class="datepicker-wrapper">
                    <input type="text" class="form-control" bsDatepicker #dp="bsDatepicker" placeholder="dd/MM/yyyy" [disabled]="itemDisable"
                    [bsConfig]="{
                        dateInputFormat: 'DD/MM/YYYY',
                        showWeekNumbers: false
                    }"
                    (bsValueChange)="onDateSelected($event)" [ngModel]="deliveryNoteModel.voucherDate" (ngModelChange)="formatToDateInput($event)" [ngModelOptions]="{ standalone: true }"
                    />
                    <button type="button" class="btn btn-outline-secondary" (click)="dp.show()" [disabled]="itemDisable">
                    📅
                    </button>
                </div> 
            </div>
        </div>

        <!-- Customer Name -->
        <div class="col-md-3" >
            <div class="label-wrapper"  >
                <label for="item_no" class="form-label">Customer Name
                    <span class="required-star">*</span>
                </label>
            </div>
            <div class="input-wrapper">
                <ng-select  [items]="CustomerList" bindLabel="name" bindValue="creditcustomerid" [(ngModel)]="deliveryNoteModel.customer_id" class="select-input" 
                    [disabled]="itemDisable" dropdownPanelClass="'black-dropdown'" [ngModelOptions]="{ standalone: true }" >
                </ng-select>
            </div>
        </div>

        <!-- Warehouse -->
        <div class="col-md-3">
            <div class="label-wrapper d-flex align-items-center">
            <label for="godown_code" class="form-label  mb-0">Warehouse Name
                <span class="required-star">*</span>
            </label>
            </div>
            <div class="input-wrapper">
                <select class="label-input" id="godown_code"  name="godown_code" [(ngModel)]="deliveryNoteModel.godown_code" #godown_code="ngModel" [disabled]="itemDisable" >
                <option *ngFor="let main of warehouseList" [value]="main.godown_code">{{ main.godown_name }}</option>
                </select>
            </div>
        </div>
        
        <!--  Mobile Number-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="mobile_no" class="form-label"> Mobile Number
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="mobile_no" [disabled]="true"  
                    name="mobile_no" [(ngModel)]="deliveryNoteModel.mobile_no" #mobile_no="ngModel"  >
            </div>
        </div>  
        
    </div>

    <div class="row">
        <!--  Order Number-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="order_no" class="form-label"> Order Number
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="order_no" [disabled]="true"  
                    name="order_no" [(ngModel)]="deliveryNoteModel.order_no" #order_no="ngModel"  >
            </div>
        </div> 

        <!--  Invoice Number-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="invoice_no" class="form-label"> Invoice Number
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="invoice_no" [disabled]="true"  
                    name="invoice_no" [(ngModel)]="deliveryNoteModel.invoice_no" #invoice_no="ngModel"  >
            </div>
        </div> 

        <!-- Reference-->
        <!-- <div class="col-md-4">
            <div class="label-wrapper">
                <label for="voucher_reference" class="form-label"> Reference
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="voucher_reference" [disabled]="true"  
                    name="voucher_reference" [(ngModel)]="deliveryNoteModel.voucher_reference" #voucher_reference="ngModel"  >
            </div>
        </div>  -->
    </div>

        <fieldset class="border" >
      <legend class="legend-left">
          {{ 'Oil And Gas Details' }}
      </legend>
      <div class="row">
        <!--  Contarct Number-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="contarct_no" class="form-label"> Contarct Number
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="contarct_no" [disabled]="true"  
                    name="contarct_no" [(ngModel)]="oilAndGasModel.contarct_no" #contarct_no="ngModel"  >
            </div>
        </div>  

         <!--  PO Number-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="po_no" class="form-label"> PO Number
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="po_no" [disabled]="true"  
                    name="po_no" [(ngModel)]="oilAndGasModel.po_no" #po_no="ngModel"  >
            </div>
        </div>  

         <!--  Order Date-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="voucherDate" class="form-label"> Order Date
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="voucherDate" [disabled]="true"  
                    name="voucherDate" [(ngModel)]="oilAndGasModel.voucherDate" #voucherDate="ngModel"  >
            </div>
        </div>  

         <!--  Total Amount-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="line_amount" class="form-label"> Total Amount
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="line_amount" [disabled]="true"  
                    name="line_amount" [(ngModel)]="oilAndGasModel.line_amount" #line_amount="ngModel"  >
            </div>
        </div>  

         <!--  Gross Weight-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="gross_weight" class="form-label"> Gross Weight
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="gross_weight" [disabled]="true"  
                    name="gross_weight" [(ngModel)]="oilAndGasModel.gross_weight" #gross_weight="ngModel"  >
            </div>
        </div>  

         <!--  No of Pallets-->
        <div class="col-md-2">
            <div class="label-wrapper">
                <label for="no_pallets" class="form-label"> No of Pallets
                </label>
            </div>
            <div class="input-wrapper">
                <input type="text" class="label-input" id="no_pallets" [disabled]="true"  
                    name="no_pallets" [(ngModel)]="oilAndGasModel.no_pallets" #no_pallets="ngModel"  >
            </div>
        </div>  
      </div>
    </fieldset>

    <br>

    <ngx-datatable 
        class="table table-bordered styled-grid"
        [rows]="rows"
        [scrollbarV]="scroll"
        [virtualization]="true"
        [style.height.px]="gridHeight"
        [columnMode]="'force'"
        [headerHeight]="50"
        [footerHeight]="60"
        [rowHeight]="30"
        [limit]="controls.pageSize"
        [externalPaging]="false"
        [selected]="selected"
        [messages]="{ emptyMessage: 'No data to display' }"
        [reorderable]="reorderable"
        [selectionType]="SelectionType.single"
        [rowIdentity]="getRowIdentity"
        (activate)="onSubListActivate($event)"
        [rowClass]="getRowClass"
        >

        <!-- Sl No -->
        <ngx-datatable-column name="Sl No"  prop="line_no" [maxWidth]="80">
        <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
        <input 
        type="text" 
            class="form-control" 
            value ="{{ rowIndex + 1 }}" disabled
            />
        </ng-template>
    </ngx-datatable-column>

    <!-- Item Code -->
    <ngx-datatable-column name="Item Code" prop="item_no" [minWidth]="180">
        <ng-template let-row="row" ngx-datatable-cell-template>
        <ng-select 
            [items]="ItemList" 
            bindLabel="item_code" 
            bindValue="item_no" 
            [(ngModel)]="row.item_no"
            (focus)="row.previousRate = row.item_no" 
            (change)="ItemCodeEnter(row.item_no, row)"
            [disabled]="itemDisable"
            class="form-control grid-select"
            [ngModelOptions]="{ standalone: true }"
            [appendTo]="'body'">
        </ng-select>
        </ng-template>
    </ngx-datatable-column>

    <!-- Model Name -->
    <ngx-datatable-column name="Model Name" prop="item_name_abbr" [minWidth]="300">
        <ng-template let-row="row" ngx-datatable-cell-template>
            <input 
            list="ItemList" 
            type="text" 
            class="form-control" 
            [(ngModel)]="row.item_name_abbr" 
            [ngModelOptions]="{standalone: true}" 
            (change)="ModelNameChange(row.item_name_abbr,row)" 
            [disabled]="itemDisable" />

            <datalist id="ItemList">
            <option *ngFor="let item of ItemList" [value]="item.item_code + ' - ' + item.item_name_abbr">
            </option>
            </datalist>
        </ng-template>
    </ngx-datatable-column>

    <!-- Unit -->
    <ngx-datatable-column name="Unit" prop="unit_name">
        <ng-template let-row="row" ngx-datatable-cell-template>
        <input 
            type="text" 
            class="form-control grid-input" 
            [(ngModel)]="row.unit_name" 
            [disabled]="true" 
            [ngModelOptions]="{ standalone: true }" />
        </ng-template>
    </ngx-datatable-column>

    <!-- Qty -->
    <ngx-datatable-column name="Qty" prop="issue_quantity">
        <ng-template let-row="row" ngx-datatable-cell-template>
        <input 
            type="number" 
            class="form-control grid-input" 
            [(ngModel)]="row.issue_quantity" 
            [disabled]="itemDisable" 
            [ngModelOptions]="{ standalone: true }" />
        </ng-template>
    </ngx-datatable-column>

    <!--Res. Qty -->
    <ngx-datatable-column name="Res. Qty" prop="receipt_quantity">
        <ng-template let-row="row" ngx-datatable-cell-template>
        <input 
            type="number" 
            class="form-control grid-input" 
            [(ngModel)]="row.receipt_quantity" 
            [disabled]="itemDisable" 
            [ngModelOptions]="{ standalone: true }" />
        </ng-template>
    </ngx-datatable-column>

    <!-- Tags-->
    <ngx-datatable-column name="Tags" prop="Tags">
        <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
            <button 
            type="button"
            class="btn-link" 
            [disabled]=""
            (click)="openTag(row,rowIndex)"
            >
            Tags
            </button>
        </ng-template>
    </ngx-datatable-column>

    <!--Po Line No-->
    <ngx-datatable-column name="Po Line No" prop="po_line_no">
        <ng-template let-row="row" ngx-datatable-cell-template>
        <input 
            type="number" 
            class="form-control grid-input" 
            [(ngModel)]="row.po_line_no" 
            [disabled]="true" 
            [ngModelOptions]="{ standalone: true }" />
        </ng-template>
    </ngx-datatable-column>

    <!-- Print -->
    <ngx-datatable-column name="Print" prop="print" [maxWidth]="60" >
        <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
        <label class="toggle-switch" >
            <input  style="display:block; margin:0 auto;"
            type="checkbox"
            [(ngModel)]="row.print"
            name="print{{rowIndex}}"
            class="custom-input"
            [disabled] ="true" 
            [ngModelOptions]="{ standalone: true }" 
            />
            <span class="slider"></span>
        </label>
        </ng-template>
    </ngx-datatable-column>

    <!-- Delete -->
    <ngx-datatable-column name="Delete" [maxWidth]="70">
        <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
            <button 
            type="button" 
            class="btn btn-danger btn-sm delete-btn" 
            (click)="deleteRow(rowIndex,row)" 
            [disabled]="itemDisable">
            🗑️
            </button>
        </ng-template>
    </ngx-datatable-column>

    <!-- Footer -->
    <ngx-datatable-footer>
        <ng-template ngx-datatable-footer-template>
            <div class="col-md-12 d-flex justify-content-end align-items-center gap-2 datatable-footer-border">
            <span>Total Rows: {{ rows.length }}</span>
            <div class="btn-group">
                <button type="button" class="btn btn-add" (click)="addRow()" [disabled]="itemDisable">➕ Add</button>
            </div>
            </div>
        </ng-template>
        </ngx-datatable-footer>
    </ngx-datatable>

    <div class="row">
        <!-- Approval Status -->
        <div class="col-md-2">
            <div class="label-wrapper">
            <label for="approval_status" class="form-label">Status
            </label>
            </div>
            <div class="input-wrapper">
            <input type="text" class="label-input" id="approval_status" [disabled]="statusDisable"  
                name="approval_status" [(ngModel)]="deliveryNoteModel.approval_status" #approval_status="ngModel">
            </div>
        </div>

        <!-- Status Reference -->
        <div class="col-md-3">
            <div class="label-wrapper">
            <label for="voucher_reference" class="form-label">Status Reference
            </label>
            </div>
            <div class="input-wrapper">
            <input type="text" class="label-input" id="voucher_reference" [disabled]="statusDisable"  
                name="voucher_reference" [(ngModel)]="deliveryNoteModel.voucher_reference" #voucher_reference="ngModel">
            </div>
        </div>
        

        <!-- Total Amount-->
        <div class="col-md-2 ms-auto">
            <div class="label-wrapper">
            <label for="total_amount" class="form-label">Total Amount
            </label>
            </div>
            <div class="input-wrapper">
            <input type="text" class="label-input" id="total_amount" [disabled]="true"  
                name="total_amount" [(ngModel)]="deliveryNoteModel.total_amount" #total_amount="ngModel">
            </div>
        </div>

    </div>
    <br>

    <div class="row">
      <!-- Created By-->
      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="created_by" class="form-label">Created By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="created_by" [disabled]="true"  
              name="created_by" [(ngModel)]="deliveryNoteModel.created_by" #created_by="ngModel">
        </div>
      </div>
      <!-- Created On-->
      <div class="col-md-1">
        <div class="label-wrapper">
          <label for="created_date" class="form-label">Created On
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="created_date" [disabled]="true"  
              name="created_date" [(ngModel)]="deliveryNoteModel.created_date" #created_date="ngModel">
        </div>
      </div>
      <!-- Updated By -->
      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="modified_by" class="form-label">Modified By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="modified_by" [disabled]="true"  
              name="modified_by" [(ngModel)]="deliveryNoteModel.modified_by" #modified_by="ngModel">
        </div>
      </div>
      <!-- Updated On -->
      <div class="col-md-1">
        <div class="label-wrapper">
          <label for="modified_date" class="form-label">Modified On
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="modified_date" [disabled]="true"  
              name="modified_date" [(ngModel)]="deliveryNoteModel.modified_date" #modified_date="ngModel">
        </div>
      </div>

      <div class="col-md-2">
        <div class="label-wrapper">
          <label for="approved_by" class="form-label">Approved By
          </label>
        </div>
        <div class="input-wrapper">
          <input type="text" class="label-input" id="approved_by" [disabled]="true"  
              name="approved_by" [(ngModel)]="deliveryNoteModel.approved_by" #approved_by="ngModel">
        </div>
      </div>
      <!-- Remarks -->
      <div class="col-md-4">
        <div class="label-wrapper">
          <label for="approver_remarks" class="form-label">Approval Remarks
          </label>
        </div>
        <div class="input-wrapper">
            <textarea class="label-input" id="approver_remarks" name="approver_remarks" rows="2"
              [(ngModel)]="deliveryNoteModel.approver_remarks" #approver_remarks="ngModel" [disabled]="true" >
            </textarea>
        </div>
      </div>
    </div>

    <!-- Footer Buttons -->
    <div class="inbox-compose-footer" style="overflow: hidden;">
        <div class="btn-group pull-right">
            <div class="badge bg-color-greenLight action mine"></div>
            <button type="submit" class="btn btn-primary" style="margin-right: 5px" [disabled]="saveDisable">
            <i class="fa fa-save"></i>Save
            </button>
            <button type="button" class="btn btn-danger" [disabled]="cancelDisable" (click)="cancelClickMethod()">
            <i class="fa fa-ban"></i>Cancel
            </button>
        </div>
    </div> 
  </form>
</div>


<!-- TAg Modal -->
<div *ngIf="showModalTags" class="modal fade show d-block" tabindex="-1" role="dialog" aria-labelledby="myLargeModalLabel" aria-hidden="true" style="background-color: rgba(0,0,0,0.5);">    
    <div class="modal-dialog modal-lg" style="min-width: 1700px;">
        <div class="modal-content shadow-lg rounded">
            <div class="modal-header bg-light border-bottom">
                <h5 class="modal-title text-primary">Tags of Item :  {{selectedRow?.item_name_abbr}}</h5>
                <button type="button" class="btn btn-light rounded-circle shadow-sm position-absolute top-0 end-0 m-3"
                        (click)="modalCancel()" aria-label="Close" title="Close">
                <i class="fas fa-times text-danger"></i>
                </button>
            </div>
            <div class="modal-body px-4 py-3">
                <div class="container-fluid">
                    <ngx-datatable 
                        class="table table-bordered styled-grid"
                        [rows]="rowsTags"
                        [scrollbarV]="scroll"
                        [virtualization]="true"
                        [style.height.px]="gridHeight"
                        [columnMode]="'force'"
                        [headerHeight]="50"
                        [footerHeight]="60"
                        [rowHeight]="30"
                        [limit]="controls.pageSize"
                        [externalPaging]="false"
                        [selected]="selectedTags"
                        [messages]="{ emptyMessage: 'No data to display' }"
                        [reorderable]="reorderable"
                        [selectionType]="SelectionType.single"
                        [rowIdentity]="getRowIdentityTags"
                        (activate)="onSubListActivateTags($event)">

                        <!-- Sl No -->
                        <ngx-datatable-column name="Sl No"  prop="line_no" [maxWidth]="80">
                            <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
                            <input 
                            type="text" 
                                class="form-control" 
                                value ="{{ rowIndex + 1 }}" disabled
                                />
                            </ng-template>
                        </ngx-datatable-column>

                        <!-- Serial No -->
                        <ngx-datatable-column name="Serial No" prop="serial_no" [minWidth]="180">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                            <ng-select 
                                [items]="TagList" 
                                bindLabel="serial_no" 
                                bindValue="serial_no" 
                                [(ngModel)]="row.serial_no"
                                (focus)="row.previousRate = row.serial_no" 
                                [disabled]="itemDisable"
                                class="form-control grid-select"
                                [ngModelOptions]="{ standalone: true }"
                                [appendTo]="'body'">
                            </ng-select>
                            </ng-template>
                        </ngx-datatable-column>

                        <!-- Tag No -->
                        <ngx-datatable-column name="Tag No" prop="tag_no" [minWidth]="180">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                            <ng-select 
                                [items]="TagList" 
                                bindLabel="tag_no" 
                                bindValue="tag_no" 
                                [(ngModel)]="row.tag_no"
                                (focus)="row.previousRate = row.tag_no" 
                                [disabled]="itemDisable"
                                class="form-control grid-select"
                                [ngModelOptions]="{ standalone: true }"
                                [appendTo]="'body'">
                            </ng-select>
                            </ng-template>
                        </ngx-datatable-column>

                        <!-- Jobcard No -->
                        <ngx-datatable-column name="Jobcard No" prop="jobcard_no">
                            <ng-template let-row="row" ngx-datatable-cell-template>
                            <input 
                                type="text" 
                                class="form-control grid-input" 
                                [(ngModel)]="row.jobcard_no" 
                                [disabled]="itemDisable"
                                [ngModelOptions]="{ standalone: true }" />
                            </ng-template>
                        </ngx-datatable-column>

                        <!-- New Tag -->
                        <ngx-datatable-column name="New Tag" prop="new_check">
                            <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
                            <label class="toggle-switch">
                                <input
                                type="checkbox"
                                [(ngModel)]="row.new_check"
                                name="new_check{{rowIndex}}"
                                class="custom-input"
                                [disabled] ="itemDisable" 
                                [ngModelOptions]="{ standalone: true }" 
                                />
                                <span class="slider"></span>
                            </label>
                            </ng-template>
                        </ngx-datatable-column>


                        <!-- Delete -->
                        <ngx-datatable-column name="Delete" [maxWidth]="70">
                            <ng-template let-row="row" let-rowIndex="rowIndex" ngx-datatable-cell-template>
                            <button 
                                type="button" 
                                class="btn btn-danger btn-sm delete-btn" 
                                (click)="deleteRowTags(rowIndex)" 
                                [disabled]="itemDisable || row.compulsory == true">
                                🗑️
                            </button>
                            </ng-template>
                        </ngx-datatable-column>

                        <!-- Footer -->
                        <ngx-datatable-footer>
                            <ng-template ngx-datatable-footer-template>
                            <div class="col-md-12 d-flex justify-content-end align-items-center gap-2 datatable-footer-border">
                                <span>Total Rows: {{ rowsTags.length }}</span>
                                <div class="btn-group">
                                <button type="button" class="btn btn-add" (click)="addRowTags()" [disabled]="itemDisable">➕ Add</button>
                                </div>
                            </div>
                            </ng-template>
                        </ngx-datatable-footer>
                    </ngx-datatable>
                </div>
                <div class="modal-footer bg-light border-top">
                    <button class="btn btn-primary" (click)="modalSave()" [disabled] ="itemDisable" >Ok</button>
                    <button class="btn btn-danger" (click)="modalCancel()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
</div>
